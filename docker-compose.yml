services:
  app:
    build: ./backend
    image: url-shortener-app:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_started

  worker:
    build: ./backend
    image: url-shortener-worker:local
    restart: unless-stopped
    command: ["node", "./src/api/worker.js"]
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      disable: true

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data:
    driver: local